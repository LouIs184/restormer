# general settings
name: CT_ImageDomain_Restormer
model_type: ImageCleanModel
scale: 1
num_gpu: 1            # 改成你的 GPU 数；0 表示纯 CPU（极慢，仅调试）
manual_seed: 100

# dataset and data loader settings
datasets:
  train:
    name: TrainSet
    type: Dataset_CTImage
    txt: ./train_img.txt
    hu_min: -1000     # 与 AICTVer2 PhaseCT 一致（经 analyze_hu_range.py 确认）
    hu_max: 1000
    geometric_augs: true

    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 4

    ### ------- 渐进式训练（小 patch 先训，再逐步放大）--------
    mini_batch_sizes: [4, 3, 2, 1]       # 每 GPU 批大小
    iters: [30000, 24000, 18000, 18000]  # 每个阶段的迭代数
    gt_size: 256                         # 最大 patch 尺寸
    gt_sizes: [128, 160, 192, 256]       # 对应各阶段 patch 尺寸
    ### -------------------------------------------------------

    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: ValSet
    type: Dataset_CTImage
    txt: ./valid_img.txt
    hu_min: -1000
    hu_max: 1000
    io_backend:
      type: disk

# network structures
network_g:
  type: Restormer
  inp_channels: 1     # 灰度 CT 切片
  out_channels: 1     # 残差结构，必须与 inp_channels 相同
  dim: 48
  num_blocks: [4, 6, 6, 8]
  num_refinement_blocks: 4
  heads: [1, 2, 4, 8]
  ffn_expansion_factor: 2.66
  bias: False
  LayerNorm_type: WithBias
  dual_pixel_task: False

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  total_iter: 90000
  warmup_iter: -1
  use_grad_clip: true

  # 前 3 万轮固定 3e-4，之后余弦退火到 1e-6
  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [30000, 60000]
    restart_weights: [1, 1]
    eta_mins: [0.0003, 0.000001]

  mixing_augs:
    mixup: true        # 数据量小，建议开 mixup 缓解过拟合
    mixup_beta: 1.2
    use_identity: true

  optim_g:
    type: AdamW
    lr: !!float 3e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean

# validation settings
val:
  window_size: 8
  val_freq: !!float 1000
  save_img: false
  rgb2bgr: true
  use_image: false        # 直接在张量上算 PSNR（归一化域），避免 uint8 量化
  max_minibatch: 8

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 200
  save_checkpoint_freq: !!float 5000
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
