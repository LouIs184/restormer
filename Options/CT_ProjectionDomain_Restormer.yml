# 投影域训练配置：domain: proj（方案 B，按视角取探测器平面，同 AICT-code）
# 切回图像域：把两处 type/domain 段换成 image 域参数（见 docs/5-PROJECTION_DOMAIN.md §2.2）
name: CT_ProjectionDomain_Restormer
model_type: ImageCleanModel
scale: 1
num_gpu: 1            # 改成你的 GPU 数；0 表示纯 CPU（极慢，仅调试）
manual_seed: 100

# dataset and data loader settings
datasets:
  train:
    name: TrainSet
    type: Dataset_CT
    domain: proj                  # ← 域开关：'image' | 'proj'
    txt: ./train_proj_img.txt

    proj_norm_clip_max: 0.28      # 投影域归一化（同 AICT proj_reader）：clip(x,0,0.28)/0.28
    proj_crop_rows: 16            # 裁上下黑边：128 - 2×16 = 96 行
    geometric_augs: false         # 投影域禁 90° 旋转（交换视角轴/通道轴，物理无意义）

    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 4         # 须 = max(mini_batch_sizes)=4（渐进式阶段从这里子采样）

    ### 渐进式训练：gt_sizes 上限必须 ≤ 裁剪后高度 96（Restormer 只需 8 整除）
    mini_batch_sizes: [4, 3, 2, 1]
    iters: [30000, 24000, 18000, 18000]
    gt_size: 96
    gt_sizes: [48, 64, 80, 96]
    ### -------------------------------------------------------

    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: ValSet
    type: Dataset_CT
    domain: proj
    txt: ./valid_proj_img.txt
    proj_norm_clip_max: 0.28
    proj_crop_rows: 16
    io_backend:
      type: disk

# network structures
network_g:
  type: Restormer
  inp_channels: 1     # 单通道视角平面；双能可设 2
  out_channels: 1     # 残差结构，必须与 inp_channels 相同
  dim: 48
  num_blocks: [4, 6, 6, 8]
  num_refinement_blocks: 4
  heads: [1, 2, 4, 8]
  ffn_expansion_factor: 2.66
  bias: False
  LayerNorm_type: WithBias
  dual_pixel_task: False

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  total_iter: 90000
  warmup_iter: -1
  use_grad_clip: true

  # 前 3 万轮固定 3e-4，之后余弦退火到 1e-6
  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [30000, 60000]
    restart_weights: [1, 1]
    eta_mins: [0.0003, 0.000001]

  mixing_augs:
    mixup: false       # 投影域样本多（7200），AICT 投影域配置未开 mixup；想开设 true
    mixup_beta: 1.2
    use_identity: true

  optim_g:
    type: AdamW
    lr: !!float 3e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]

  # losses：post-log 噪声近似高斯，L1 是合理起点；想对齐 AICT 基线（MSE）就改 type: MSELoss
  pixel_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean

# validation settings
val:
  window_size: 8
  val_freq: !!float 1000
  save_img: false
  rgb2bgr: true
  use_image: false        # 直接在张量上算 PSNR（归一化域），避免 uint8 量化
  max_minibatch: 8

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 200
  save_checkpoint_freq: !!float 5000
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
